spring.application.name=backend

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/redeeme?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:0679}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Google Client ID (for ID token verification)
google.client-id=${GOOGLE_CLIENT_ID:815467473744-7s3bfsjcil6jfnp53vsotj8vm27kean1.apps.googleusercontent.com}

# JWT
jwt.secret=${JWT_SECRET:redeeme-jwt-secret-key-change-this-in-production-must-be-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:604800000}

# CORS (comma-separated origin list)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}